function startMistakeReview() {
  playSound('click');
  
  if (todayMistakes.length === 0) {
    showTodayMistakes();
    return;
  }
  
  mistakeReviewState = {
    currentIndex: 0,
    score: 0,
    answered: false,
    mistakes: todayMistakes.slice() // Copy để không ảnh hưởng
  };
  
  renderMistakeReview();
}

function renderMistakeReview() {
  var state = mistakeReviewState;
  
  if (state.currentIndex >= state.mistakes.length) {
    showMistakeReviewResult();
    return;
  }
  
  var m = state.mistakes[state.currentIndex];
  
  // Progress dots
  var dotsHtml = '';
  for (var i = 0; i < state.mistakes.length; i++) {
    var dotClass = 'dot';
    if (i < state.currentIndex) dotClass += ' done';
    else if (i === state.currentIndex) dotClass += ' active';
    dotsHtml += '<div class="' + dotClass + '"></div>';
  }
  
  var html = '<div class="progress-header">' +
    '<button class="back-btn" onclick="showTodayMistakes()">← Back</button>' +
    '<div class="progress-dots">' + dotsHtml + '</div>' +
    '<div class="star-count">✓ ' + state.score + '</div>' +
    '</div>';
  
  if (m.quizType === 'sentence') {
    // Render sentence quiz
    var displaySentence = m.sentence.replace(m.signal, '<u style="text-decoration:underline;text-decoration-color:#FF9800;text-decoration-thickness:2px;font-weight:700">' + m.signal + '');
    displaySentence = displaySentence.replace('___', '<span class="blank">?</span>');
    
    html += '<div class="sentence-quiz-card">' +
      (m.emoji ? '<div style="font-size:3rem;text-align:center;margin-bottom:10px">' + m.emoji + '</div>' : '') +
      '<div style="text-align:center;margin-bottom:8px;color:#F44336;font-size:0.9rem">🔄 Ôn tập câu sai</div>' +
      '<div class="sentence-quiz-sentence">' + displaySentence + '</div>' +
      '<div class="sentence-quiz-choices">';
    
    // Tạo choices từ correctAnswer và wrongAnswers
    var choices = [{ answer: m.correctAnswer, isCorrect: true }];
    
    // Tạo wrong answers dựa vào type
    if (m.type === 'affirm') {
      var verbForms = getVerbForms(m.verb);
      if (m.isPast) {
        var presentForm = getPresentForm(verbForms.base, m.subject);
        if (presentForm !== m.correctAnswer) choices.push({ answer: presentForm, isCorrect: false });
      } else {
        if (verbForms.past !== m.correctAnswer) choices.push({ answer: verbForms.past, isCorrect: false });
      }
      if (verbForms.base !== m.correctAnswer && !choices.some(function(c) { return c.answer === verbForms.base; })) {
        choices.push({ answer: verbForms.base, isCorrect: false });
      }
    } else if (m.type === 'negative') {
      var negatives = ["don't", "doesn't", "didn't"];
      negatives.forEach(function(n) {
        if (n !== m.correctAnswer) choices.push({ answer: n, isCorrect: false });
      });
    } else if (m.type === 'question' || m.type === 'question_verb') {
      var verbForms = getVerbForms(m.verb);
      if (verbForms.past !== m.correctAnswer && !choices.some(function(c) { return c.answer === verbForms.past; })) {
        choices.push({ answer: verbForms.past, isCorrect: false });
      }
      var vPresent = getPresentForm(verbForms.base, 'She');
      if (vPresent !== m.correctAnswer && !choices.some(function(c) { return c.answer === vPresent; })) {
        choices.push({ answer: vPresent, isCorrect: false });
      }
    }
    
    // Nếu chưa đủ đáp án (do no-change verb), thêm từ nhiễu
    var distractors = ['went', 'goes', 'ate', 'eats', 'took', 'takes', 'saw', 'sees', 'came', 'comes'];
    var di = 0;
    while (choices.length < 4 && di < distractors.length) {
      if (distractors[di] !== m.correctAnswer && !choices.some(function(c) { return c.answer === distractors[di]; })) {
        choices.push({ answer: distractors[di], isCorrect: false });
      }
      di++;
    }
    
    // Shuffle và hiển thị
    choices = shuffle(choices).slice(0, 4);
    var correctIdx = -1;
    choices.forEach(function(c, idx) {
      if (c.isCorrect) correctIdx = idx;
      html += '<button class="sentence-choice-btn" id="mr-choice-' + idx + '" onclick="checkMistakeReviewAnswer(' + idx + ', ' + c.isCorrect + ')">' + c.answer + '</button>';
    });
    mistakeReviewState.correctIdx = correctIdx;
    
    html += '</div><div id="mistakeReviewFeedback"></div></div>';
    
  } else {
    // Render verb form quiz
    html += '<div class="sentence-quiz-card">' +
      '<div style="text-align:center;margin-bottom:8px;color:#F44336;font-size:0.9rem">🔄 Ôn tập câu sai</div>' +
      '<div style="font-size:1.2rem;color:#666;margin-bottom:10px">Dạng ' + (m.mode === 'past' ? 'quá khứ (V2)' : 'phân từ (V3)') + ' của:</div>' +
      '<div style="font-size:2.5rem;font-weight:800;color:#4CAF50;margin:20px 0">' + m.verb + '</div>' +
      '<div style="color:#999;margin-bottom:20px">' + m.verbVn + '</div>' +
      '<input type="text" id="mrVerbInput" class="quiz-input" placeholder="Nhập đáp án..." onkeypress="if(event.key===\'Enter\')checkMistakeReviewVerbAnswer()">' +
      '<div id="mistakeReviewFeedback" style="margin-top:15px"></div>' +
      '</div>';
  }
  
  document.getElementById('learnScreen').innerHTML = html;
  showScreen('learnScreen');
  
  // Focus vào input nếu có
  var input = document.getElementById('mrVerbInput');
  if (input) input.focus();
}

function checkMistakeReviewAnswer(choiceIdx, isCorrect) {
  if (mistakeReviewState.answered) return;
  mistakeReviewState.answered = true;
  
  var m = mistakeReviewState.mistakes[mistakeReviewState.currentIndex];
  var correctIdx = mistakeReviewState.correctIdx;
  
  document.querySelectorAll('.sentence-choice-btn').forEach(function(btn, idx) {
    btn.disabled = true;
    if (idx === choiceIdx && isCorrect) btn.classList.add('correct');
    else if (idx === choiceIdx && !isCorrect) btn.classList.add('wrong');
    if (idx === correctIdx && !isCorrect) btn.classList.add('show-correct');
  });
  
  if (isCorrect) {
    mistakeReviewState.score++;
    playSound('correct');
    // Xóa câu này khỏi danh sách sai vì đã trả lời đúng
    var originalIdx = todayMistakes.findIndex(function(tm) {
      return tm.sentence === m.sentence && tm.correctAnswer === m.correctAnswer;
    });
    if (originalIdx >= 0) removeMistake(originalIdx);
  } else {
    playSound('wrong');
  }
  
  var explanation = m.isPast ? 
    '🌙 <strong>' + m.signal + '</strong> → quá khứ: <strong>' + m.correctAnswer + '</strong>' :
    '☀️ <strong>' + m.signal + '</strong> → hiện tại: <strong>' + m.correctAnswer + '</strong>';
  
  var feedbackHtml = '<div class="sentence-feedback ' + (isCorrect ? 'correct' : 'wrong') + '">' +
    '<div class="emoji">' + (isCorrect ? '🎉' : '💪') + '</div>' +
    '<div class="message">' + (isCorrect ? 'Đúng rồi! Đã xóa khỏi danh sách sai.' : 'Vẫn chưa đúng, cố gắng thêm nhé!') + '</div>' +
    '<div class="explanation">' + explanation + '</div>' +
    '<button class="next-btn" onclick="nextMistakeReview()">' +
    (mistakeReviewState.currentIndex < mistakeReviewState.mistakes.length - 1 ? 'Tiếp theo →' : 'Xem kết quả 🏆') +
    '</button></div>';
  
  document.getElementById('mistakeReviewFeedback').innerHTML = feedbackHtml;
}

function checkMistakeReviewVerbAnswer() {
  if (mistakeReviewState.answered) return;
  
  var input = document.getElementById('mrVerbInput');
  var userAnswer = input.value.trim().toLowerCase();
  var m = mistakeReviewState.mistakes[mistakeReviewState.currentIndex];
  
  var correctAnswers = m.correctAnswer.toLowerCase().split('/').map(function(a) { return a.trim(); });
  var isCorrect = correctAnswers.indexOf(userAnswer) >= 0;
  
  mistakeReviewState.answered = true;
  input.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  
  if (isCorrect) {
    mistakeReviewState.score++;
    playSound('correct');
    var originalIdx = todayMistakes.findIndex(function(tm) {
      return tm.verb === m.verb && tm.correctAnswer === m.correctAnswer;
    });
    if (originalIdx >= 0) removeMistake(originalIdx);
  } else {
    playSound('wrong');
  }
  
  var feedbackHtml = '<div class="sentence-feedback ' + (isCorrect ? 'correct' : 'wrong') + '">' +
    '<div class="emoji">' + (isCorrect ? '🎉' : '💪') + '</div>' +
    '<div class="message">' + (isCorrect ? 'Đúng rồi! Đã xóa khỏi danh sách sai.' : 'Đáp án đúng: ' + m.correctAnswer) + '</div>' +
    '<button class="next-btn" onclick="nextMistakeReview()">' +
    (mistakeReviewState.currentIndex < mistakeReviewState.mistakes.length - 1 ? 'Tiếp theo →' : 'Xem kết quả 🏆') +
    '</button></div>';
  
  document.getElementById('mistakeReviewFeedback').innerHTML = feedbackHtml;
}

function nextMistakeReview() {
  mistakeReviewState.currentIndex++;
  mistakeReviewState.answered = false;
  renderMistakeReview();
}

function showMistakeReviewResult() {
  var state = mistakeReviewState;
  var total = state.mistakes.length;
  var percentage = Math.round((state.score / total) * 100);
  
  var emoji = percentage >= 80 ? '🏆' : percentage >= 50 ? '⭐' : '💪';
  var message = percentage >= 80 ? 'Luyện tập có hiệu quả! Con nhớ tốt hơn rồi!' : 
                percentage >= 50 ? 'Khá tốt! Tiếp tục ôn tập nhé!' : 
                'Cần ôn thêm một chút nữa!';
  
  var remainingCount = todayMistakes.length;
  
  var html = '<div class="result-content"><div class="result-card">' +
    '<div class="result-emoji">' + emoji + '</div>' +
    '<div class="result-title">' + message + '</div>' +
    '<div style="font-size:2.5rem;font-weight:800;color:#667eea;margin:15px 0">' + state.score + ' / ' + total + '</div>' +
    '<div style="color:#666;margin-bottom:10px">' + percentage + '% chính xác</div>' +
    (remainingCount > 0 ? 
      '<div style="background:#FFF3E0;padding:10px;border-radius:10px;margin-bottom:15px;color:#E65100">Còn ' + remainingCount + ' câu cần ôn lại</div>' :
      '<div style="background:#E8F5E9;padding:10px;border-radius:10px;margin-bottom:15px;color:#2E7D32">🎉 Đã hoàn thành tất cả!</div>') +
    '<div class="result-buttons">' +
    (remainingCount > 0 ? '<button class="result-btn primary" onclick="startMistakeReview()">Ôn tiếp 🔄</button>' : '') +
    '<button class="result-btn ' + (remainingCount > 0 ? 'secondary' : 'primary') + '" onclick="startVerbSentenceQuiz()">Làm bài mới 📝</button>' +
    '<button class="result-btn secondary" onclick="showLearnScreen()">Về học tập 📚</button>' +
    '</div></div></div>';
  
  document.getElementById('learnScreen').innerHTML = html;
  showScreen('learnScreen');
  
  playSound('complete');
  if (percentage >= 70) showConfetti();
}

function ppStartQuiz(numQ) {
  let pool = [...ppQuestions];
  
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  
  ppState.questions = pool.slice(0, Math.min(numQ, pool.length));
  ppState.current = 0;
  ppState.score = 0;
  ppState.answers = [];
  ppState.answered = false;
  
  ppRenderQuestion();
}

function ppRenderQuestion() {
  if (ppState.current >= ppState.questions.length) {
    ppShowResult();
    return;
  }
  
  let q = ppState.questions[ppState.current];
  let total = ppState.questions.length;
  
  // Extract emoji from start of question
  let qText = q.q;
  let sceneEmoji = '';
  let emojiMatch = qText.match(/^([\u{1F000}-\u{1FFFF}][\u{FE00}-\u{FE0F}]?[\u{200D}]?[\u{1F000}-\u{1FFFF}]?|[\u{2600}-\u{27BF}]|[\u{1F300}-\u{1F9FF}]+)\s*/u);
  if (emojiMatch) {
    sceneEmoji = emojiMatch[1];
    qText = qText.slice(emojiMatch[0].length);
  }
  
  // Build sentence with blank
  let sentence = qText.replace('_____', '<span class="pp-blank" id="ppBlank">?</span>');
  
  // Progress dots
  let dotsHtml = '';
  for (let i = 0; i < total; i++) {
    let dotClass = 'dot';
    if (i < ppState.current) dotClass += ' done';
    else if (i === ppState.current) dotClass += ' active';
    dotsHtml += '<div class="' + dotClass + '"></div>';
  }
  
  let html = '<div class="progress-header">' +
    '<button class="back-btn" onclick="goHome()">← Home</button>' +
    '<div class="progress-dots">' + dotsHtml + '</div>' +
    '<div class="star-count">⭐ ' + ppState.score + '</div>' +
    '</div>' +
    '<div class="story-scene">';
  
  if (sceneEmoji) {
    html += '<div class="scene-image">' + sceneEmoji + '</div>';
  }
  
  html += '<div class="scene-text">' + sentence + '</div>' +
    '<div class="choice-buttons" id="ppChoices">';
  
  q.opts.forEach((opt, i) => {
    html += '<button class="choice-btn" onclick="ppAnswer(' + i + ')" id="ppOpt' + i + '">' + opt + '</button>';
  });
  
  html += '</div><div id="ppFeedback"></div></div>';
  
  document.getElementById('quizArea').innerHTML = html;
  showScreen('quizScreen');
}

function ppAnswer(idx) {
  if (ppState.answered) return;
  ppState.answered = true;
  
  let q = ppState.questions[ppState.current];
  let correct = idx === q.ans;
  
  if (correct) {
    ppState.score++;
    playSound('correct');
  } else {
    playSound('wrong');
  }
  
  ppState.answers.push({ q: q, chosen: idx, correct: correct });
  
  // Show answer in blank
  let blank = document.getElementById('ppBlank');
  if (blank) {
    blank.textContent = q.opts[correct ? idx : q.ans];
    blank.className = correct ? 'pp-filled' : 'pp-filled pp-filled-wrong';
  }
  
  // Highlight buttons
  let chosen = document.getElementById('ppOpt' + idx);
  if (chosen) chosen.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    let correctBtn = document.getElementById('ppOpt' + q.ans);
    if (correctBtn) correctBtn.classList.add('correct');
  }
  
  // Disable all buttons
  q.opts.forEach((_, i) => {
    let btn = document.getElementById('ppOpt' + i);
    if (btn) btn.disabled = true;
  });
  
  // Feedback
  let fb = document.getElementById('ppFeedback');
  let total = ppState.questions.length;
  
  let feedbackHtml = '<div class="feedback-box ' + (correct ? 'correct' : 'wrong') + '">' +
    '<div class="feedback-emoji">' + (correct ? '🎉' : '💪') + '</div>' +
    '<div class="feedback-text">' + (correct ? '✅ Chính xác!' : '❌ Chưa đúng!') + '</div>' +
    '<div class="feedback-tip" style="text-align:left;line-height:1.6">💡 ' + q.explain + '</div>';
  
  if (!correct) {
    feedbackHtml += '<div style="margin-top:10px;padding:12px;background:#E8F5E9;border-radius:10px;color:#2E7D32;font-weight:600">' +
      '✅ Đáp án đúng: <strong>' + q.opts[q.ans] + '</strong></div>';
  }
  
  feedbackHtml += '<button class="next-btn" onclick="ppNext()">' +
    (ppState.current < total - 1 ? 'Tiếp theo →' : 'Xem kết quả 🏆') +
    '</button></div>';
  
  fb.innerHTML = feedbackHtml;
  
  if (correct) {
    try { showConfetti(); } catch(e) {}
  }
}

function ppNext() {
  ppState.current++;
  ppState.answered = false;
  ppRenderQuestion();
}

function ppShowResult() {
  let total = ppState.questions.length;
  let score = ppState.score;
  let pct = Math.round(score / total * 100);
  
  // Save best score
  let best = parseInt(localStorage.getItem('ppBestScore') || '0');
  if (pct > best) {
    localStorage.setItem('ppBestScore', pct);
  }
  
  let stars = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : pct >= 50 ? '⭐' : '💪';
  let ppMsgs90 = ['Sự kiên trì của con có kết quả rồi! 🎉','Con đã nỗ lực hết mình! 🎉','Luyện tập chăm chỉ, con tiến bộ thấy rõ! 🎉'];let ppMsgs70 = ['Con đang tiến bộ từng ngày! 👏','Mỗi lần luyện, con lại vững hơn! 👏','Cố gắng của con thật đáng khen! 👏'];let ppMsgs50 = ['Con đã dũng cảm thử sức! 📚','Sai là để hiểu hơn, con làm tốt rồi! 📚','Luyện thêm, con sẽ nhớ lâu hơn! 📚'];let ppMsgsLow = ['Kiên nhẫn luyện thêm, con sẽ tiến bộ! 💪','Mỗi câu sai là cơ hội để nhớ! 💪','Đừng bỏ cuộc, con đang trên đường tiến bộ! 💪'];let message = pct >= 90 ? ppMsgs90[Math.floor(Math.random()*3)] : pct >= 70 ? ppMsgs70[Math.floor(Math.random()*3)] : pct >= 50 ? ppMsgs50[Math.floor(Math.random()*3)] : ppMsgsLow[Math.floor(Math.random()*3)];
  
  let wrongCount = total - score;
  
  let html = '<div style="text-align:center;padding-bottom:15px">' +
    '<div style="font-size:3rem;margin-bottom:10px">💎</div>' +
    '<h2 style="color:white;margin:0">Kết quả</h2></div>';
  
  html += '<div class="pp-result-card">' +
    '<div class="pp-result-stars">' + stars + '</div>' +
    '<div class="pp-result-score">' + pct + '%</div>' +
    '<div class="pp-result-label">' + message + '</div>' +
    '<div class="pp-result-detail">' +
    '<div class="rd-item"><div class="rd-num" style="color:#4CAF50">' + score + '</div><div class="rd-label">Đúng ✅</div></div>' +
    '<div class="rd-item"><div class="rd-num" style="color:#F44336">' + wrongCount + '</div><div class="rd-label">Sai ❌</div></div>' +
    '<div class="rd-item"><div class="rd-num" style="color:#00BCD4">' + total + '</div><div class="rd-label">Tổng</div></div>' +
    '</div>';

  // Review wrong answers
  let wrongAnswers = ppState.answers.filter(a => !a.correct);
  if (wrongAnswers.length > 0) {
    html += '<div style="text-align:left;margin-top:20px"><h3 style="margin:0 0 12px;color:#333">📝 Ôn lại câu sai:</h3>';
    wrongAnswers.forEach(a => {
      html += '<div class="pp-review-item rv-wrong">' +
        '<div class="rv-q">' + a.q.q + '</div>' +
        '<div class="rv-a">❌ Bạn chọn: <b>' + a.q.opts[a.chosen] + '</b> → ✅ Đáp án: <b>' + a.q.opts[a.q.ans] + '</b></div>' +
        '<div class="rv-a" style="color:#888;margin-top:3px">💡 ' + a.q.explain + '</div></div>';
    });
    html += '</div>';
  }
  
  html += '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button style="padding:12px 28px;border-radius:25px;border:none;background:linear-gradient(135deg,#00BCD4,#009688);color:white;font-size:1rem;font-weight:700;cursor:pointer;font-family:Nunito,sans-serif" onclick="showPresentPerfectQuiz()">🔄 Làm lại</button>' +
    '<button style="padding:12px 28px;border-radius:25px;border:none;background:linear-gradient(135deg,#FF9800,#F57C00);color:white;font-size:1rem;font-weight:700;cursor:pointer;font-family:Nunito,sans-serif" onclick="goHome()">🏠 Về trang chủ</button>' +
    '</div></div>';
  
  document.getElementById('quizArea').innerHTML = html;
  
  if (pct >= 70) { try { showConfetti(); } catch(e) {} }
  playSound('complete');
  
  // Save to mistake tracking
  ppState.answers.filter(a => !a.correct).forEach(a => {
    try {
      let mistakes = JSON.parse(localStorage.getItem('mistakes') || '[]');
      mistakes.push({
        date: new Date().toLocaleDateString('vi-VN'),
        type: 'Present Perfect',
        question: a.q.q,
        yourAnswer: a.q.opts[a.chosen],
        correctAnswer: a.q.opts[a.q.ans]
      });
      if (mistakes.length > 100) mistakes = mistakes.slice(-100);
      localStorage.setItem('mistakes', JSON.stringify(mistakes));
    } catch(e) {}
  });
}

      if (data.success) {
        qnNotes = data.notes || [];
        try { localStorage.setItem('quickNotes', JSON.stringify(qnNotes)); } catch(e){}
      } else {
        try { qnNotes = JSON.parse(localStorage.getItem('quickNotes') || '[]'); } catch(e) { qnNotes = []; }
      }
      qnLoading = false;
      renderQuickNote();
    })
    .catch(function() {
      try { qnNotes = JSON.parse(localStorage.getItem('quickNotes') || '[]'); } catch(e) { qnNotes = []; }
      qnLoading = false;
      renderQuickNote();
    });
}

function qnPost(action, data, cb) {
  var body = { action: action };
  if (data) Object.keys(data).forEach(function(k) { body[k] = data[k]; });
  fetch(QN_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(function(d) { if(cb) cb(d); }).catch(function() { if(cb) cb({success:false}); });
}

function renderQuickNote() {
  var notes = qnNotes;
  var html = '<div class="qn-container">' +
    '<div style="text-align:left;margin-bottom:10px;display:flex;align-items:center;gap:10px">' +
    '<button class="back-btn" onclick="goHome()">← Home</button>' +
    '<button class="back-btn" onclick="qnFetchNotes()" style="margin-left:auto">🔄</button></div>' +
    '<div class="qn-header"><div class="qn-title">📌 Quick Note</div>' +
    '<div class="qn-subtitle">Ghi chú & link học tập</div></div>';

  if (qnLoading) {
    html += '<div class="qn-empty"><div class="qn-empty-icon">⏳</div><div class="qn-empty-text">Đang tải...</div></div></div>';
    document.getElementById('quickNoteArea').innerHTML = html;
    return;
  }

  // Simple textarea to add note
  html += '<div class="qn-add-box">' +
    '<textarea class="qn-textarea" id="qnText" placeholder="Ghi chú hoặc dán link vào đây...&#10;&#10;VD:&#10;https://example.com&#10;Học Present Perfect bài 3"></textarea>' +
    '<button class="qn-save-btn" id="qnSaveBtn" onclick="qnSave()">📌 Thêm ghi chú</button></div>';

  // Notes list
  if (notes.length === 0) {
    html += '<div class="qn-empty"><div class="qn-empty-icon">📝</div>' +
      '<div class="qn-empty-text">Chưa có ghi chú nào</div></div>';
  } else {
    html += '<div class="qn-count">' + notes.length + ' ghi chú</div><div class="qn-list">';
    notes.forEach(function(n, idx) {
      var links = qnExtractLinks(n.text || '');
      var displayText = qnLinkify(qnEsc(n.text || ''));
      html += '<div class="qn-card">' +
        '<div class="qn-card-text">' + displayText + '</div>' +
        '<div class="qn-card-date">' + (n.date || '') + '</div>' +
        '<div class="qn-card-actions">' +
        '<button class="qn-action-btn qn-copy-btn" onclick="qnCopy(' + idx + ')">📋 Copy</button>';
      links.forEach(function(link, li) {
        html += '<button class="qn-action-btn qn-open-btn" onclick="window.open(\'' + qnEsc(link) + '\',\'_blank\')">🔗 Mở link' + (links.length > 1 ? ' ' + (li+1) : '') + '</button>';
      });
      html += '<button class="qn-action-btn qn-delete-btn" onclick="qnDel(' + idx + ')">🗑</button>' +
        '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('quickNoteArea').innerHTML = html;
}

function qnEsc(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s || ''));
  return d.innerHTML;
}

function qnExtractLinks(text) {
  var regex = /https?:\/\/[^\s<>"']+/g;
  return text.match(regex) || [];
}

function qnLinkify(escapedText) {
  return escapedText.replace(/(https?:\/\/[^\s<>&"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function qnSave() {
  var text = document.getElementById('qnText').value.trim();
  if (!text) return;
  var btn = document.getElementById('qnSaveBtn');
  if (btn) { btn.textContent = '⏳ Đang lưu...'; btn.disabled = true; }
  qnPost('add', {
    text: text,
    date: new Date().toLocaleDateString('vi-VN')
  }, function() {
    playSound('correct');
    qnFetchNotes();
  });
}

function qnCopy(idx) {
  var text = qnNotes[idx] && qnNotes[idx].text || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      var btns = document.querySelectorAll('.qn-copy-btn');
      if (btns[idx]) { btns[idx].textContent = '✅ Copied!'; setTimeout(function(){ btns[idx].textContent = '📋 Copy'; }, 1500); }
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    var btns = document.querySelectorAll('.qn-copy-btn');
    if (btns[idx]) { btns[idx].textContent = '✅ Copied!'; setTimeout(function(){ btns[idx].textContent = '📋 Copy'; }, 1500); }
  }
}

function qnDel(idx) {
  if (!confirm('Xoá ghi chú này?')) return;
  qnPost('delete', { row: idx }, function() {
    playSound('wrong');
    qnFetchNotes();
  });
}
</script>
</body>
</html>
